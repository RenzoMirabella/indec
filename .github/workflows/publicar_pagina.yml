name: Publicar página

on:
  schedule:
    # Una vez por día: si no hay datos nuevos, la página queda igual salvo la fecha.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias de las pruebas
        run: pip install -r requirements.txt
      - name: Probar
        run: python -m unittest discover -s tests
      - name: Armar la página
        # Si un dato no pasa las validaciones, la tarea falla y queda publicada la versión anterior.
        env:
          INDEC_TOKEN: ${{ secrets.INDEC_TOKEN }}
        run: python pipeline/indicadores.py --salida _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
